name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Sample and synthetic builds must not call INECC, SEMADET, datos.gob.mx, or INEGI.
      # The committed files under data/samples and data/livability/samples are the fixtures.
      AIRE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests dashboard
      - name: Tests
        run: pytest
      - name: Build dashboard data from the public excerpt
        run: python -m aire_abierto.pipeline --source sample --out build/dashboard-data
      - name: Build dashboard data from the synthetic fallback
        run: python -m aire_abierto.pipeline --source synthetic --out build/synthetic-data
      - name: Build the livability mart from committed public excerpts
        run: python -m aire_abierto.livability.pipeline --source sample --out build/livability
      - name: Build the livability mart from the synthetic fallback
        run: python -m aire_abierto.livability.pipeline --source synthetic --out build/livability-synthetic
